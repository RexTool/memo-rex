[project]
name = "ai-service"
version = "0.1.0"

requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.34",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff==0.17.5",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
